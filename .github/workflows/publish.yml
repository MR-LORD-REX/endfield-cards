name: Publish Python package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag matching the package version (for example v2.0.0a1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify tag matches pyproject version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          version = project['project']['version']
          tag = os.environ['RELEASE_TAG']
          expected_tag = f'v{version}'
          if tag != expected_tag:
              raise SystemExit(f'Tag {tag} does not match project version {version} (expected {expected_tag})')
          print(f'Version verified: {version} matches tag {tag}')
          PY

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distribution packages
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist/
