[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endfield-cards"
description = "Async Endfield image cards from SKPort models for any player"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE.txt", "src/endfield_cards/assets/resources/licenses/*"]
authors = [{name = "sora"}]
dynamic = ["version"]
dependencies = ["skport-py", "Pillow>=10", "aiohttp>=3.9,<4", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.9", "mypy>=1.14", "build>=1.2", "wheel"]
asset-tools = ["resvg-py==0.5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "endfield_cards._version.__version__"}

[tool.setuptools.package-data]
endfield_cards = ["py.typed", "assets/resources/**/*", "i18n/locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../skport-py/src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
